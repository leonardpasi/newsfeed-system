[project]
name = "newsfeed-system-lambda"
version = "0.1.0"
description = "Serverless newsfeed system using AWS Lambda and LLM-based relevance filtering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.39.3",
    "feedparser>=6.0.11",
    "openai>=1.93.0",
    "praw>=7.8.1",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.4",
]


[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.2",
]
